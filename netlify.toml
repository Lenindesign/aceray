[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    Vary = "Accept-Encoding"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.sanity.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://aceray.com https://*.aceray.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://aceray.com https://*.aceray.com; connect-src 'self' https://xm9au2qy.apicdn.sanity.io https://xm9au2qy.api.sanity.io https://*.sanity.io https://aceray.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[redirects]]
  from = "/portfolio/*"
  to = "/product/:splat"
  status = 301

[[redirects]]
  from = "/item/*"
  to = "/product/:splat"
  status = 301

[[redirects]]
  from = "/products/*"
  to = "/product/:splat"
  status = 301

[[redirects]]
  from = "/product-category/*"
  to = "/catalog?cat=:splat"
  status = 301

[[redirects]]
  from = "/designer/*"
  to = "/designers/:splat"
  status = 301

[[redirects]]
  from = "/collection/*"
  to = "/collections/:splat"
  status = 301

[[redirects]]
  from = "/family/*"
  to = "/collections/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
