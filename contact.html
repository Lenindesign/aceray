<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Aceray</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/components.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="/index.html"><img src="/assets/images/logo.svg" alt="Aceray logo" height="40" /></a>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/catalog.html">Catalog</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>
    <main style="padding: var(--space-4); max-width: 800px; margin: auto;">
      <h1>Contact Us</h1>
      <p>We’d love to hear from you! Reach out via the form below or email us at <a href="mailto:info@aceray.com">info@aceray.com</a>.</p>
      <form action="#" method="POST" style="display:flex; flex-direction:column; gap:var(--space-2);">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button class="button button-primary" type="submit">Send Message</button>
      </form>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
